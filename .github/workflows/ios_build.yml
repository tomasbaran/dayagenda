name: iOS Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'  # or your version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ipa --release --export-options-plist=ExportOptions.plist

      # Optional: Upload artifact to GitHub Actions output
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa